name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install
        run: npm ci
      - name: Type and Astro checks
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Privacy primitive review
        run: |
          if grep -RInE "fetch\\(|XMLHttpRequest|sendBeacon|WebSocket" src public; then
            echo "Network primitive found. Review against AGENTS.md privacy boundary."
            exit 1
          fi
