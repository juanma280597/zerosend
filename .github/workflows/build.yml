name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type and Astro checks
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Validation regression tests
        run: npm test
      - name: Privacy primitive review
        run: npm run audit:privacy
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser regression tests
        run: npm run test:browser
